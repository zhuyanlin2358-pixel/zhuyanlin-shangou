<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SG 组件协议 -->
  <meta name="sg-component" content="true">
  <meta name="sg-name" content="蒙层动画">
  <meta name="sg-id" content="overlay-anim">
  <meta name="sg-canvas-width" content="750">
  <meta name="sg-canvas-height" content="1600">
  <meta name="sg-version" content="1.0.0">
  <meta name="sg-author" content="shangou-team">

  <title>蒙层动画 V1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* 隐藏滚动条 */
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <canvas id="canvas" width="750" height="1600"></canvas>

  <script>
    /**
     * 蒙层动画 V1.0
     * - 支持外部配置传入 (SG_SET_CONFIG)
     * - 支持导出截图 (SG_EXPORT)
     * - 可扩展的动效系统
     */

    // ============ 配置状态 ============
    const state = {
      canvas: null,
      ctx: null,
      width: 750,
      height: 1600,

      // 蒙层配置
      config: {
        card: {
          imageUrl: '',
          title: '限时特惠',
          subtitle: '全场满199减50',
          btnText: '立即抢购',
          btnLink: '#'
        },
        animation: {
          type: 'slide-up',
          duration: 300
        },
        style: {
          bgColor: '#000000',
          bgOpacity: 0.7,
          closeBtn: 'top-right'
        },
        theme: {
          bgColor: '#FFD9E5',
          isLightBg: true
        }
      },

      // 动画状态
      animProgress: 0,
      isAnimating: false,
      animationId: null
    }

    // ============ 动效实现 ============
    const Animations = {
      // 淡入
      fade: (progress) => ({
        opacity: progress,
        translateY: 0,
        scale: 1,
        rotate: 0
      }),

      // 上滑
      'slide-up': (progress) => ({
        opacity: progress,
        translateY: 100 * (1 - progress),
        scale: 1,
        rotate: 0
      }),

      // 缩放
      scale: (progress) => ({
        opacity: progress,
        translateY: 0,
        scale: 0.8 + 0.2 * progress,
        rotate: 0
      }),

      // 翻转
      flip: (progress) => ({
        opacity: progress,
        translateY: 0,
        scale: 1,
        rotate: 90 * (1 - progress)
      })
    }

    // ============ 初始化 ============
    function init() {
      state.canvas = document.getElementById('canvas')
      state.ctx = state.canvas.getContext('2d')

      // 通知父窗口已就绪
      notifyReady()

      // 开始渲染循环
      requestAnimationFrame(renderLoop)

      // 自动播放一次入场动画
      playEntryAnimation()
    }

    function notifyReady() {
      window.parent.postMessage({
        type: 'SG_READY',
        meta: {
          name: document.querySelector('meta[name="sg-name"]').content,
          id: document.querySelector('meta[name="sg-id"]').content,
          width: state.width,
          height: state.height,
          version: document.querySelector('meta[name="sg-version"]').content
        }
      }, '*')
    }

    // ============ 配置处理 ============
    function applyConfig(payload) {
      console.log('[overlay-anim] 接收配置:', payload)

      if (payload.card) {
        state.config.card = { ...state.config.card, ...payload.card }
      }
      if (payload.animation) {
        state.config.animation = { ...state.config.animation, ...payload.animation }
      }
      if (payload.style) {
        state.config.style = { ...state.config.style, ...payload.style }
      }
      if (payload.theme) {
        state.config.theme = { ...state.config.theme, ...payload.theme }
      }

      // 如果有卡片图，预加载
      if (state.config.card.imageUrl) {
        preloadCardImage()
      }

      // 重新播放入场动画
      playEntryAnimation()
    }

    let cardImage = null
    function preloadCardImage() {
      if (!state.config.card.imageUrl) return
      cardImage = new Image()
      cardImage.src = state.config.card.imageUrl
    }

    // ============ 入场动画 ============
    function playEntryAnimation() {
      state.animProgress = 0
      state.isAnimating = true
      const duration = state.config.animation.duration
      const startTime = performance.now()

      function animate(now) {
        const elapsed = now - startTime
        state.animProgress = Math.min(elapsed / duration, 1)

        // 缓动函数 ease-out
        state.animProgress = 1 - Math.pow(1 - state.animProgress, 3)

        if (state.animProgress < 1) {
          requestAnimationFrame(animate)
        } else {
          state.isAnimating = false
        }
      }

      requestAnimationFrame(animate)
    }

    // ============ 渲染循环 ============
    function renderLoop() {
      const ctx = state.ctx
      const cfg = state.config

      // 清空画布
      ctx.clearRect(0, 0, state.width, state.height)

      // 1. 绘制背景（模拟会场背景）
      ctx.fillStyle = cfg.theme.bgColor || '#FFD9E5'
      ctx.fillRect(0, 0, state.width, state.height)

      // 2. 绘制蒙层背景
      const opacity = cfg.style.bgOpacity * (state.isAnimating ? state.animProgress : 1)
      ctx.fillStyle = hexToRgba(cfg.style.bgColor, opacity)
      ctx.fillRect(0, 0, state.width, state.height)

      // 3. 计算卡片动画变换
      const animFn = Animations[cfg.animation.type] || Animations['slide-up']
      const transform = animFn(state.isAnimating ? state.animProgress : 1)

      // 4. 绘制卡片
      ctx.save()

      // 应用变换
      const centerX = state.width / 2
      const centerY = state.height / 2
      ctx.translate(centerX, centerY + transform.translateY)
      ctx.scale(transform.scale, transform.scale)
      ctx.rotate(transform.rotate * Math.PI / 180)
      ctx.globalAlpha = transform.opacity

      // 卡片尺寸
      const cardW = 640
      const cardH = 800
      const cardX = -cardW / 2
      const cardY = -cardH / 2

      // 绘制卡片背景
      if (cardImage && cardImage.complete) {
        // 有图片则绘制图片
        ctx.drawImage(cardImage, cardX, cardY, cardW, cardH)
      } else {
        // 无图片则绘制白色背景
        ctx.fillStyle = '#FFFFFF'
        ctx.beginPath()
        ctx.roundRect(cardX, cardY, cardW, cardH, 16)
        ctx.fill()

        // 绘制占位提示
        ctx.fillStyle = '#CCCCCC'
        ctx.font = '24px sans-serif'
        ctx.textAlign = 'center'
        ctx.fillText('请上传卡片图片', 0, 0)
      }

      // 绘制标题
      ctx.fillStyle = '#333333'
      ctx.font = 'bold 48px PingFang SC, sans-serif'
      ctx.textAlign = 'center'
      ctx.fillText(cfg.card.title, 0, cardY + 500)

      // 绘制副标题
      ctx.fillStyle = '#666666'
      ctx.font = '32px PingFang SC, sans-serif'
      ctx.fillText(cfg.card.subtitle, 0, cardY + 560)

      // 绘制按钮
      const btnW = 480
      const btnH = 80
      const btnX = -btnW / 2
      const btnY = cardY + 620

      // 按钮背景（渐变色）
      const gradient = ctx.createLinearGradient(btnX, btnY, btnX + btnW, btnY)
      gradient.addColorStop(0, '#FF5050')
      gradient.addColorStop(1, '#FF8080')
      ctx.fillStyle = gradient
      ctx.beginPath()
      ctx.roundRect(btnX, btnY, btnW, btnH, 40)
      ctx.fill()

      // 按钮文字
      ctx.fillStyle = '#FFFFFF'
      ctx.font = 'bold 32px PingFang SC, sans-serif'
      ctx.fillText(cfg.card.btnText, 0, btnY + btnH / 2 + 10)

      ctx.restore()

      // 5. 绘制关闭按钮
      if (cfg.style.closeBtn === 'top-right') {
        drawCloseButton(ctx, state.width - 60, 60)
      } else if (cfg.style.closeBtn === 'bottom') {
        drawCloseButton(ctx, state.width / 2, state.height - 100)
      }

      requestAnimationFrame(renderLoop)
    }

    function drawCloseButton(ctx, x, y) {
      ctx.save()
      ctx.translate(x, y)

      // 圆形背景
      ctx.fillStyle = 'rgba(0,0,0,0.3)'
      ctx.beginPath()
      ctx.arc(0, 0, 24, 0, Math.PI * 2)
      ctx.fill()

      // X 符号
      ctx.strokeStyle = '#FFFFFF'
      ctx.lineWidth = 3
      ctx.lineCap = 'round'
      ctx.beginPath()
      ctx.moveTo(-8, -8)
      ctx.lineTo(8, 8)
      ctx.moveTo(8, -8)
      ctx.lineTo(-8, 8)
      ctx.stroke()

      ctx.restore()
    }

    // ============ 工具函数 ============
    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16)
      const g = parseInt(hex.slice(3, 5), 16)
      const b = parseInt(hex.slice(5, 7), 16)
      return `rgba(${r}, ${g}, ${b}, ${alpha})`
    }

    // ============ 导出功能 ============
    function exportPNG() {
      // 确保动画完成
      state.animProgress = 1
      state.isAnimating = false

      // 等待一帧确保渲染完成
      requestAnimationFrame(() => {
        const dataUrl = state.canvas.toDataURL('image/png')
        window.parent.postMessage({
          type: 'SG_EXPORT_RESULT',
          dataUrl: dataUrl
        }, '*')
      })
    }

    // ============ 消息监听 ============
    window.addEventListener('message', (e) => {
      const { type, payload } = e.data || {}

      switch (type) {
        case 'SG_SET_CONFIG':
          applyConfig(payload)
          break

        case 'SG_EXPORT':
          exportPNG()
          break

        case 'SG_PREVIEW':
          // 预览模式：立即导出当前帧
          const previewData = state.canvas.toDataURL('image/png')
          window.parent.postMessage({
            type: 'SG_PREVIEW_RESULT',
            dataUrl: previewData
          }, '*')
          break
      }
    })

    // ============ 启动 ============
    window.addEventListener('load', init)

    // ============ 扩展指南（给 gzq） ============
    /*
     * 如何添加新动效：
     *
     * 1. 在 Animations 对象中添加新方法：
     *    myEffect: (progress) => ({
     *      opacity: progress,
     *      translateY: ...,    // Y轴位移
     *      scale: ...,         // 缩放
     *      rotate: ...         // 旋转（度）
     *    })
     *
     * 2. 在工具配置中添加选项
     *
     * 示例：弹性进入
     * bounce: (progress) => {
     *   const bounce = Math.sin(progress * Math.PI * 2) * (1 - progress) * 50
     *   return {
     *     opacity: progress,
     *     translateY: 100 * (1 - progress) - bounce,
     *     scale: 1,
     *     rotate: 0
     *   }
     * }
     */
  </script>
</body>
</html>
