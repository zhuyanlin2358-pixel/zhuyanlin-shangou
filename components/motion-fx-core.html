      ctx: null,
      width: 750,
      height: 424,
      baseImage: null,
      particles: [],
      animationId: null,
      lastTime: 0,
      effects: {
        active: ['petal'],
        config: { speed: 1, density: 1, size: 1 }
      }
    }

    // 动效注册表
    const EffectRegistry = {
      petal: {
        name: '花瓣飘落',
        init: (count) => Array.from({ length: count }, () => ({
          x: Math.random() * state.width,
          y: Math.random() * state.height - state.height,
          size: (5 + Math.random() * 8) * state.effects.config.size,
          speedY: (1 + Math.random() * 2) * state.effects.config.speed,
          speedX: (Math.random() - 0.5) * 0.5,
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.02,
          opacity: 0.6 + Math.random() * 0.4,
          petalVariant: Math.floor(Math.random() * 2),
          color: `hsla(${340 + Math.random() * 40}, 70%, 80%, ${0.6 + Math.random() * 0.4})`
        })),
        update: (p) => {
          p.y += p.speedY
          p.x += p.speedX + Math.sin(p.y * 0.01) * 0.3
          p.rotation += p.rotationSpeed
          if (p.y > state.height + 20) {
            p.y = -20
            p.x = Math.random() * state.width
          }
        },
        draw: (ctx, p) => {
          ctx.save()
          ctx.translate(p.x, p.y)
          ctx.rotate(p.rotation)
          ctx.globalAlpha = p.opacity
          var img = PETAL_IMGS[p.petalVariant === 1 ? 'petal3' : 'petal1']
          if (img) {
            var s = p.size * 2.8
            ctx.drawImage(img, -s / 2, -s / 2, s, s)
          } else {
            ctx.fillStyle = p.color
            ctx.beginPath()
            ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI * 2)
            ctx.fill()
          }
          ctx.restore()
        }
      },
      sparkle: {
        name: '星光闪烁',
        init: (count) => Array.from({ length: count }, () => ({
          x: Math.random() * state.width,
          y: Math.random() * state.height,
          size: (2 + Math.random() * 4) * state.effects.config.size,
          opacity: Math.random(),
          opacitySpeed: (0.02 + Math.random() * 0.03) * state.effects.config.speed,
          phase: Math.random() * Math.PI * 2
        })),
        update: (p) => {
          p.phase += p.opacitySpeed
          p.opacity = 0.3 + Math.abs(Math.sin(p.phase)) * 0.7
        },
        draw: (ctx, p) => {
          ctx.save()
          ctx.globalAlpha = p.opacity
          ctx.fillStyle = '#fff'
          const s = p.size
          ctx.beginPath()
          ctx.moveTo(p.x, p.y - s)
          ctx.lineTo(p.x + s * 0.3, p.y - s * 0.3)
          ctx.lineTo(p.x + s, p.y)
          ctx.lineTo(p.x + s * 0.3, p.y + s * 0.3)
          ctx.lineTo(p.x, p.y + s)
          ctx.lineTo(p.x - s * 0.3, p.y + s * 0.3)
          ctx.lineTo(p.x - s, p.y)
          ctx.lineTo(p.x - s * 0.3, p.y - s * 0.3)
          ctx.closePath()
          ctx.fill()
          ctx.restore()
        }
      },
      confetti: {
        name: '彩屑纸片',
        init: (count) => Array.from({ length: count }, () => ({
          x: Math.random() * state.width,
          y: Math.random() * state.height - state.height,
          size: (4 + Math.random() * 6) * state.effects.config.size,
          speedY: (2 + Math.random() * 3) * state.effects.config.speed,
          speedX: (Math.random() - 0.5) * 2,
          rotation: Math.random() * Math.PI * 2,
          rotationSpeed: (Math.random() - 0.5) * 0.05,
          color: `hsla(${Math.random() * 360}, 80%, 60%, 0.8)`,
          opacity: 0.6 + Math.random() * 0.4
        })),
        update: (p) => {
          p.y += p.speedY
          p.x += p.speedX
          p.rotation += p.rotationSpeed
          if (p.y > state.height + 20) {
            p.y = -20
            p.x = Math.random() * state.width
          }
        },
        draw: (ctx, p) => {
          ctx.save()
          ctx.translate(p.x, p.y)
          ctx.rotate(p.rotation)
          ctx.globalAlpha = p.opacity
          ctx.fillStyle = p.color
          ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size)
          ctx.restore()
        }
      },
      snow: {
        name: '雪花飘落',
        init: (count) => Array.from({ length: count }, () => ({
          x: Math.random() * state.width,
          y: Math.random() * state.height - state.height,
          size: (3 + Math.random() * 5) * state.effects.config.size,
          speedY: (0.5 + Math.random() * 1.5) * state.effects.config.speed,
          speedX: (Math.random() - 0.5) * 0.3,
          opacity: 0.4 + Math.random() * 0.4
        })),
        update: (p) => {
          p.y += p.speedY
          p.x += p.speedX + Math.sin(p.y * 0.005) * 0.2
          if (p.y > state.height + 10) {
            p.y = -10
            p.x = Math.random() * state.width
          }
        },
        draw: (ctx, p) => {
          ctx.save()
          ctx.globalAlpha = p.opacity
          ctx.fillStyle = '#fff'
          ctx.beginPath()
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2)
          ctx.fill()
          ctx.restore()
        }
      },
      sweep: {
        name: '扫光效果',
        init: (count) => [{
          x: -100,
          y: 0,
          width: 100,
          height: state.height,
          speedX: (3 + Math.random() * 2) * state.effects.config.speed,
          opacity: 0.3
        }],
        update: (p) => {
          p.x += p.speedX
          if (p.x > state.width + 100) {
            p.x = -100
          }
        },
        draw: (ctx, p) => {
          ctx.save()
          const gradient = ctx.createLinearGradient(p.x, 0, p.x + p.width, 0)
          gradient.addColorStop(0, 'rgba(255,255,255,0)')
          gradient.addColorStop(0.5, `rgba(255,255,255,${p.opacity})`)
          gradient.addColorStop(1, 'rgba(255,255,255,0)')
          ctx.fillStyle = gradient
          ctx.fillRect(p.x, p.y, p.width, p.height)
          ctx.restore()
        }
      },
      bubble: {
        name: '气泡上升',
        init: (count) => Array.from({ length: count }, () => ({
          x: Math.random() * state.width,
          y: state.height + Math.random() * 100,
          size: (8 + Math.random() * 12) * state.effects.config.size,
          speedY: (1 + Math.random() * 2) * state.effects.config.speed,
          speedX: (Math.random() - 0.5) * 0.5,
          opacity: 0.3 + Math.random() * 0.4,
          wobble: Math.random() * Math.PI * 2,
          wobbleSpeed: 0.02 + Math.random() * 0.03
        })),
        update: (p) => {
          p.y -= p.speedY
          p.wobble += p.wobbleSpeed
          p.x += Math.sin(p.wobble) * 0.5
          if (p.y < -p.size) {
            p.y = state.height + p.size
            p.x = Math.random() * state.width
          }
        },
        draw: (ctx, p) => {
          ctx.save()
          ctx.globalAlpha = p.opacity
          // 气泡外圈
          const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size)
          gradient.addColorStop(0, 'rgba(255,255,255,0.3)')
          gradient.addColorStop(0.7, 'rgba(255,255,255,0.1)')
          gradient.addColorStop(1, 'rgba(255,255,255,0.05)')
          ctx.fillStyle = gradient
          ctx.beginPath()
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2)
          ctx.fill()
          // 高光
          ctx.fillStyle = 'rgba(255,255,255,0.4)'
          ctx.beginPath()
          ctx.arc(p.x - p.size * 0.3, p.y - p.size * 0.3, p.size * 0.2, 0, Math.PI * 2)
          ctx.fill()
          ctx.restore()
        }
      },
      rain: {
        name: '雨滴下落',
        init: (count) => Array.from({ length: count }, () => ({
          x: Math.random() * state.width,
          y: Math.random() * state.height - state.height,
          length: (10 + Math.random() * 20) * state.effects.config.size,
          speedY: (8 + Math.random() * 4) * state.effects.config.speed,
          opacity: 0.3 + Math.random() * 0.4,
          color: `hsla(${200 + Math.random() * 20}, 30%, 80%, ${0.3 + Math.random() * 0.3})`
        })),
        update: (p) => {
          p.y += p.speedY
          if (p.y > state.height + p.length) {
            p.y = -p.length
            p.x = Math.random() * state.width
          }
        },
        draw: (ctx, p) => {
          ctx.save()
          ctx.globalAlpha = p.opacity
          ctx.strokeStyle = p.color
          ctx.lineWidth = 1.5
          ctx.beginPath()
          ctx.moveTo(p.x, p.y)
          ctx.lineTo(p.x, p.y + p.length)
          ctx.stroke()
          ctx.restore()
        }
      }
    }

    function init() {
      state.canvas = document.getElementById('canvas')
      state.ctx = state.canvas.getContext('2d')
      notifyReady()
      requestAnimationFrame(renderLoop)
    }

    function notifyReady() {
      window.parent.postMessage({
        type: 'SG_READY',
        meta: {
          name: document.querySelector('meta[name="sg-name"]').content,
          id: document.querySelector('meta[name="sg-id"]').content,
          version: document.querySelector('meta[name="sg-version"]').content,
          effects: Object.entries(EffectRegistry).map(([id, e]) => ({ id, name: e.name }))
        }
      }, '*')
    }

    function applyConfig(config) {
      console.log('[motion-fx-core] 接收配置:', config)

      // 加载底图（工具侧已画好完整头图）
      if (config.images?.main) {
        const img = new Image()
        img.onload = () => {
          state.baseImage = img
          console.log('[motion-fx-core] 底图加载成功')
        }
        img.onerror = () => {
          console.error('[motion-fx-core] 底图加载失败')
          state.baseImage = null
        }
        img.src = config.images.main
      } else {
        state.baseImage = null
      }

      // 动效配置
      if (config.custom) {
        state.effects.active = config.custom.activeEffects || ['petal']
        state.effects.config = {
          speed: config.custom.config?.speed ?? 1,
          density: config.custom.config?.density ?? 1,
          size: config.custom.config?.size ?? 1
        }
        initParticles()
      }
    }

    function initParticles() {
      state.particles = []
      state.effects.active.forEach(effectId => {
        const effect = EffectRegistry[effectId]
        if (!effect) return
        const count = Math.floor(30 * state.effects.config.density)
        const particles = effect.init(count)
        particles.forEach(p => p.effectId = effectId)
        state.particles.push(...particles)
      })
    }

    function renderLoop(timestamp) {
      const ctx = state.ctx
      ctx.clearRect(0, 0, state.width, state.height)

      // 1. 绘制底图（工具侧画好的完整头图）
      if (state.baseImage) {
        ctx.drawImage(state.baseImage, 0, 0, state.width, state.height)
      }

      // 2. 叠加粒子动效
      state.particles.forEach(p => {
        const effect = EffectRegistry[p.effectId]
        if (effect) {
          effect.update(p)
          effect.draw(ctx, p)
        }
      })

      state.animationId = requestAnimationFrame(renderLoop)
    }

    function exportPNG() {
      const dataUrl = state.canvas.toDataURL('image/png')
      window.parent.postMessage({ type: 'SG_EXPORT_RESULT', dataUrl }, '*')
    }

    // 消息监听
    window.addEventListener('message', (e) => {
      const { type, payload } = e.data || {}
      switch (type) {
        case 'SG_SET_CONFIG':
          applyConfig(payload)
          break
        case 'SG_EXPORT':
          exportPNG()
          break
      }
    })

    window.addEventListener('load', init)
  </script>
</body>
</html>
